<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Reel - AI Reel Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/create.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="./index.html">AI Reel Generator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="./create.html">Create Reel</a></li>
                    <li class="nav-item"><a class="nav-link" href="./gallery.html">Gallery</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="upload-section">
        <div class="container">
            <div class="upload-container">
                <h1 class="upload-title">Create Your Reel</h1>
                <p class="upload-instructions">Upload your video files to create an amazing reel. You can upload multiple files.</p>
                
                <form id="demoForm">
                    <div class="fallback">
                        <div id="fileInputs">
                            <div class="file-input-group">
                                <input name="file1" type="file" class="file-input" />
                                <button type="button" class="remove-file-btn" onclick="removeFileInput(this)" disabled>×</button>
                            </div>
                        </div>
                        <button type="button" class="add-file-btn" onclick="addFileInput()">+ Add File</button>
                    </div>
                    
                    <div class="text-input-container">
                        <textarea class="text-input" id="textInput" name="text" placeholder="Enter your text to be added as voice here..." rows="4"></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">
                        Create Reel
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container text-center text-white py-4">
            <p>© 2024 AI Reel Generator. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let fileCounter = 2;
        function addFileInput() {
            const fileInputs = document.getElementById('fileInputs');
            const newFileInput = document.createElement('div');
            newFileInput.className = 'file-input-group';
            newFileInput.innerHTML = `<input type="file" class="file-input" /><button type="button" class="remove-file-btn" onclick="removeFileInput(this)">×</button>`;
            fileInputs.appendChild(newFileInput);
            fileCounter++;
        }
        function removeFileInput(button) {
            button.parentElement.remove();
        }

        document.getElementById('demoForm').onsubmit = function(e) {
            e.preventDefault();
            alert("This is a demo! To actually create a reel, please run the app locally using 'python main.py' and visit localhost:5000.");
        };
    </script>
</body>
</html>
